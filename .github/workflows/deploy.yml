name: deploy-bookdown

on:
  push:
    branches:
      - main

jobs:
  deploy-book:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.1'
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev pandoc

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c("bookdown", "dplyr", "ggplot2", "scales", "knitr", "kableExtra", "viridisLite", "nortest", "car"))'

      - name: Build the book
        run: |
          Rscript -e 'bookdown::render_book("index.Rmd", output_dir = "_book")'

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_book
